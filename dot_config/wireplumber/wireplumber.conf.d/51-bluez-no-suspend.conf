# Keep Bluetooth audio outputs awake: suspending them after silence makes
# the headphones (e.g. AirPods) drop the link and cut off the start of sounds.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 240
      }
    }
  }
]
